<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>Uptime</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/auth.js"></script>
  <script defer src="/static/ramp_ui.js"></script>
  <script defer src="/static/workspace_ui.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <a class="skip" href="#workspace">Skip to content</a>
  <aside class="rail">
    <a class="brand" href="#overview" aria-label="Uptime, overview"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10"/><path d="M9.5 11v11a8 8 0 0 0 16 0V11m-5 5 5-5 5 5"/></svg><span>Uptime<small>for Ramp</small></span></a>
    <p class="rail-workspace"><span id="workspace-name">Uptime</span></p>
    <nav aria-label="Main navigation" class="rail-primary">
      <a href="#overview" data-view="ramp"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/></svg>Overview</a>
      <a href="#cases" data-view="disputes"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 9.5 3.8 3h8.4L14 9.5V13H2z"/><path d="M2 9.5h3.4a2.6 2.6 0 0 0 5.2 0H14"/></svg>Cases</a>
      <a href="#agreements" data-view="vendors"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3M6.2 8.5h3.6M6.2 11h3.6"/></svg>Agreements</a>
      <a href="#activity" data-view="activity"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5h3l2-5 3 9 2-4h3"/></svg>Activity</a>
    </nav>
    <details class="rail-more">
      <summary>More tools</summary>
      <nav aria-label="More tools">
        <a href="#records" data-view="records">Ramp records</a>
        <a href="#dashboard" data-view="dashboard">Case ledger</a>
        <a href="#onboarding" data-view="onboarding">Onboarding lab</a>
        <a href="#policy" data-view="policy">Policies</a>
        <a href="#integrations" data-view="integrations">Integrations</a>
        <a href="#advanced" data-view="advanced">Advanced workflows</a>
        <a href="#regression" data-view="regression">Regression comparison</a>
      </nav>
    </details>
    <div class="rail-foot"><button id="refresh" class="quiet"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7M13.3 2.2v2.9h-2.9"/></svg><span>Refresh data</span></button><button id="account" class="quiet">Account</button></div>
  </aside>
  <main id="workspace" tabindex="-1">
    <div id="notice" role="status" aria-live="polite"></div>
    <div id="content" aria-busy="true"><p class="empty boot">Loading the workbench…</p></div>
  </main>
  <dialog id="inspector" aria-labelledby="case-title"><div class="dialog-toolbar"><span>Case inspector</span><button id="close-inspector" class="quiet" aria-label="Close case inspector">Close ✕</button></div><div id="case-content"></div></dialog>
</body>
</html>
