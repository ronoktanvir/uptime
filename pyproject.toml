[project]
name = "uptime-finance"
version = "0.1.0"
description = "Local Ramp sandbox contract enforcement workbench"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "cryptography>=43,<47",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "playwright>=1.50,<2",
    "hypothesis>=6.170.14",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
